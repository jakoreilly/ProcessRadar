name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # WPF and the ETW/WMI capture paths are Windows-only, so there is no point
    # matrixing this across other runners.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ProcessRadar.slnx

      - name: Build
        run: dotnet build ProcessRadar.slnx -c Release --no-restore
